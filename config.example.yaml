# Configuration SensAI — copiez ce fichier en config.yaml (chargé automatiquement)
# ou passez-le explicitement avec : python src/main.py --config mon_fichier.yaml
#
# Priorité : arguments CLI > ce fichier > variables d'environnement (.env) > valeurs par défaut.
# Toutes les clés sont optionnelles.

ollama:
  host: http://localhost:11434
  model: llama3.2
  embed_model: nomic-embed-text
  timeout: 120          # secondes
  keep_alive: "30m"     # durée de maintien du modèle en mémoire ("1h", "-1" = toujours)

database:
  url: sqlite:///galerelm.db

prompt:
  # Description des outils dans le prompt système : names (défaut, mesuré), full (signatures) ou none
  tools_listing: names
  # Agent par défaut (A5) : alibi, tuteur, juriste, ou un persona déclaré plus bas. Changement en session : /persona
  persona: alibi

# Guardrails (EV2)
guardrails:
  input: off            # off, safety ou alibi : classe chaque demande et bloque les demandes dangereuses
  output: off           # off, anonymize ou refuse : données personnelles dans les réponses
  pii: [email, phone, iban, card, ssn]

# Personas supplémentaires (A5) : nom, description, instructions ({persona} est remplacé par le nom)
personas:
  support:
    name: Agent support
    description: Aide les clients de la boutique
    instructions: Tu es {persona}. Tu réponds poliment et brièvement aux questions sur les commandes.

# Serveurs MCP (T1) : leurs outils s'ajoutent à ceux de SensAI. confirm: true = accord de l'utilisateur avant chaque appel
mcp_servers:
  sensai:               # notre propre serveur MCP (tools_selftest, calendar)
    command: [.venv/bin/python, -m, src.tools.mcp.server]   # lancé depuis la racine du projet
    confirm: false
  # filesystem:         # exemple de serveur MCP officiel (nécessite Node.js et un accès réseau au premier lancement)
  #   command: npx -y @modelcontextprotocol/server-filesystem /home/moi/documents
  #   confirm: true

memory:
  context_limit: 10         # messages gardés en mémoire courte avant archivage
  deep_context_limit: 4096  # entrées vectorielles max en mémoire long terme

# Paramètres de génération envoyés à Ollama, un profil par usage.
# Détail de chaque paramètre et des valeurs choisies : docs/15-parametres-generation.md
generation:
  chat:                 # la conversation
    temperature: 0.7    # 0.0 (déterministe) à 2.0
    top_k: 40
    top_p: 0.9
    min_p: 0.05
    num_ctx: 8192       # fenêtre de contexte, en tokens (voir docs/16-benchmark-ressources.md)
    num_predict: -1     # -1 = pas de limite de longueur
    seed: null          # null = aléatoire ; un entier rend les réponses reproductibles
    stop: []
  judge:                # le juge anti-hallucination (--anti-hallucination)
    temperature: 0.0
    top_k: 1
    num_predict: 160
  guardrail:            # le classifieur d'intention
    temperature: 0.0
    top_k: 1
    num_ctx: 2048
    num_predict: 128
