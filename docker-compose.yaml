services:
  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1" # garde le model en mémoire
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    entrypoint: ["sh", "-c", "ollama pull \"$$HF_MODEL\" && ollama pull \"$$EMBED_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    image: a1libi
    env_file: .env
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST}
    ports:
      - "${GRADIO_SERVER_PORT}:${GRADIO_SERVER_PORT}"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ollama-models:
