name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]


jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tool tests
        run: python -m pytest src/galerelm/unit_tests/test_tools.py -v


  mirror-to-epitech:
    runs-on: ubuntu-latest
    needs: build-and-check
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'RvbyY/A1-Libi'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EPITECH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push mirror to Epitech
        run: |
          git remote add epitech git@github.com:EpitechPGE3-2026/G-AIA-500-STG-5-1-sensai-4.git
          git push --mirror epitech